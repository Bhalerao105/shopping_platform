<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Clothing Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fff;
        }

        /* Navbar */
        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            background-color: #111;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6b81;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        nav ul li a:hover {
            color: #ff6b81;
        }

        /* Hero Section */
        .hero {
            height: 550px;
            background-image: url("https://images.unsplash.com/photo-1445205170230-053b83016050");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding-left: 80px;
        }

        .hero-text {
            background: rgba(0, 0, 0, 0.55);
            padding: 40px;
            color: white;
            max-width: 500px;
        }

        .hero-text h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 13px 30px;
            background-color: #ff6b81;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #e84f68;
        }

        /* Categories */
        .categories {
            padding: 50px 60px;
            text-align: center;
        }

        .categories h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .category-box {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .category {
            width: 250px;
            padding: 30px;
            border-radius: 10px;
            background-color: #f5f5f5;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .category h3 {
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Style<span>Hub</span></div>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="women.html">Women</a></li>
            <li><a href="Mens.html">Men</a></li>
            <li><a href="cart.html">Card</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-text">
            <h1>New Fashion Collection</h1>

            <p>
                Discover stylish and comfortable clothes
                for every occasion.
            </p>

          
        </div>

    </section>

    <!-- Categories -->
    <section class="categories">

        <h2>Shop By Category</h2>

        <div class="category-box">

            <div class="category">
                <h3> Women's Wear</h3>
                <p>Trendy dresses, kurtis and more.</p>
            </div>

            <div class="category">
                <h3>Men's Wear</h3>
                <p>Stylish shirts, jeans and outfits.</p>
            </div>

           

     

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 STYLE HUB | All Rights Reserved</p>
    </footer>

</body>
</html>
