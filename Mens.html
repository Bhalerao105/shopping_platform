<meta charset="UTF-8">

<title>Men Wear</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f7f7;
}


/* ================= HEADER ================= */

header{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:32px;
}

.cartButton{
    margin-top:15px;
    background:#e91e63;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.cartButton:hover{
    background:#c2185b;
}


/* ================= CONTAINER ================= */

.container{
    width:90%;
    margin:30px auto;
}

h2{
    text-align:center;
    margin-bottom:25px;
}


/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.category{
    width:280px;
    height:180px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    box-shadow:0 5px 15px #bbb;
    transition:0.3s;
}

.category:hover{
    transform:scale(1.05);
}

.category img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.category h3{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.65);
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
}


/* ================= SUBTYPE ================= */

#subtypeSection{
    display:none;
    margin-top:45px;
}

.subtypes{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.subtypes button{
    background:#222;
    color:white;
    border:none;
    padding:13px 25px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.subtypes button:hover{
    background:#555;
}


/* ================= PRODUCTS ================= */

#productSection{
    display:none;
    margin-top:45px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 4px 15px #ccc;
    padding-bottom:20px;
}

.product img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.product h3{
    margin:15px 0 8px;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

select{
    padding:10px;
    width:70%;
    border:1px solid #ccc;
    border-radius:7px;
    margin-bottom:12px;
}

.Buy{
    background:#222;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

.Buy:hover{
    background:green;
}


/* ================= BACK ================= */

.back{
    display:block;
    margin:25px auto;
    padding:10px 25px;
    border:none;
    background:#777;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.back:hover{
    background:#555;
}


/* ================= CART ================= */

#cartSection{
    display:none;
    margin-top:40px;
}

.cartItem{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
    display:flex;
    align-items:center;
    gap:15px;
}

.cartItem img{
    width:80px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.cartInfo{
    flex:1;
}

.cartInfo h3{
    margin-bottom:8px;
}

.cartInfo p{
    margin:5px 0;
}

.removeBtn{
    background:red;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:7px;
    cursor:pointer;
}

.removeBtn:hover{
    background:#b00000;
}

.total{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    color:green;
    margin:20px 0;
}

.checkoutBtn{
    display:block;
    margin:20px auto;
    background:green;
    color:white;
    border:none;
    padding:13px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:17px;
}

.checkoutBtn:hover{
    background:#006400;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .category{
        width:100%;
        max-width:320px;
    }

    .cartItem{
        flex-wrap:wrap;
    }

    .cartItem img{
        width:70px;
        height:80px;
    }

}

</style>

/* =====================================================
   VARIABLES
===================================================== */

let selectedCategory = "";

let cart = [];


/* =====================================================
   SHOW SUBTYPES
===================================================== */

function showSubtypes(category){

    selectedCategory = category;

    document.getElementById("subtypeSection")
        .style.display="block";

    document.getElementById("productSection")
        .style.display="none";

    document.getElementById("cartSection")
        .style.display="none";


    let subtypeBox =
        document.getElementById("subtypes");

    subtypeBox.innerHTML="";


    document.getElementById("subTitle")
        .innerText =
        clothes[category].title;


    Object.keys(clothes[category])
        .forEach(function(type){

        if(type === "title") return;


        let button =
            document.createElement("button");


        let displayName = type;


        if(type === "TShirt"){
            displayName = "T-Shirt";
        }


        displayName =
            displayName.charAt(0).toUpperCase() +
            displayName.slice(1);


        button.innerText =
            displayName;


        button.onclick=function(){

            showProducts(type);

        };


        subtypeBox.appendChild(button);

    });

}


/* =====================================================
   SHOW PRODUCTS
===================================================== */

function showProducts(type){

    document.getElementById("productSection")
        .style.display="block";

    document.getElementById("cartSection")
        .style.display="none";


    let displayTitle = type;


    if(type === "TShirt"){
        displayTitle = "T-Shirt";
    }


    document.getElementById("productTitle")
        .innerText =
        displayTitle.charAt(0).toUpperCase() +
        displayTitle.slice(1);


    let productBox =
        document.getElementById("products");


    productBox.innerHTML="";


    clothes[selectedCategory][type]
        .forEach(function(item){

        productBox.innerHTML += `

        <div class="product">

            <img src="${item.image}"
                 alt="${item.name}">

            <h3>
                ${item.name}
            </h3>

            <div class="price">
                ${item.price}
            </div>


            <select>

                <option>
                    Select Size
                </option>

                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>

            </select>

            <br>


            <button class="Buy"
                onclick='handleProductClick(${JSON.stringify(item)})'>

                ${item.subProducts ?
                "View Options" :
                "Add to Cart"}

            </button>

        </div>

        `;

    });

}


/* =====================================================
   HANDLE PRODUCT
===================================================== */

function handleProductClick(item){

    if(item.subProducts){

        showSubProducts(item.subProducts);

    }
    else{

        addToCart(item);

    }

}


/* =====================================================
   SHOW SUB PRODUCTS
===================================================== */

function showSubProducts(products){

    document.getElementById("productSection")
        .style.display="block";


    document.getElementById("cartSection")
        .style.display="none";


    document.getElementById("productTitle")
        .innerText =
        "Product Options";


    let productBox =
        document.getElementById("products");


    productBox.innerHTML="";


    products.forEach(function(item){

        productBox.innerHTML += `

        <div class="product">

            <img src="${item.image}"
                 alt="${item.name}">

            <h3>
                ${item.name}
            </h3>

            <div class="price">
                ${item.price}
            </div>


            <select>

                <option>
                    Select Size
                </option>

                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>

            </select>

            <br>


            <button class="Buy"
                    onclick='addToCart(${JSON.stringify(item)})'>

                Add to Cart

            </button>

        </div>

        `;

    });

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(item){

    cart.push(item);

    updateCartCount();

    alert(
        item.name +
        " added to cart! 🛒"
    );

}


/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount(){

    document.getElementById("cartCount")
        .innerText =
        cart.length;

}


/* =====================================================
   SHOW CART
===================================================== */

function showCart(){

    document.getElementById("productSection")
        .style.display="none";

    document.getElementById("subtypeSection")
        .style.display="none";

    document.getElementById("cartSection")
        .style.display="block";


    displayCart();

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

    let cartBox =
        document.getElementById("cartItems");


    cartBox.innerHTML="";


    let total = 0;


    if(cart.length === 0){

        cartBox.innerHTML = `

            <h3 style="text-align:center;">
                Your cart is empty 🛒
            </h3>

        `;


        document.getElementById("cartTotal")
            .innerText="0";

        return;

    }


    cart.forEach(function(item,index){

        let price =
            parseInt(
                item.price.replace(/[₹,]/g,"")
            );


        total += price;


        cartBox.innerHTML += `

        <div class="cartItem">

            <img src="${item.image}"
                 alt="${item.name}">


            <div class="cartInfo">

                <h3>
                    ${item.name}
                </h3>

                <p>
                    Price: ${item.price}
                </p>

            </div>


            <button
                class="removeBtn"
                onclick="removeFromCart(${index})">

                Remove

            </button>

        </div>

        `;

    });


    document.getElementById("cartTotal")
        .innerText =
        total.toLocaleString("en-IN");

}


/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(index){

    cart.splice(index,1);

    updateCartCount();

    displayCart();

}


/* =====================================================
   BACK TO SUBTYPE
===================================================== */

function backToSubtype(){

    document.getElementById("productSection")
        .style.display="none";

    document.getElementById("subtypeSection")
        .style.display="block";

}


/* =====================================================
   CHECKOUT
===================================================== */

function checkout(){

    if(cart.length === 0){

        alert(
            "Your cart is empty!"
        );

        return;

    }


    let total = 0;


    cart.forEach(function(item){

        total +=
            parseInt(
                item.price.replace(/[₹,]/g,"")
            );

    });


    alert(

        "Order placed successfully! 🎉\n\n" +

        "Total Amount: ₹" +

        total.toLocaleString("en-IN")

    );


    cart = [];


    updateCartCount();

    displayCart();

}

</script>

</body>

</html>
