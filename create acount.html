
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Fashion Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            color: rgb(243, 237, 237);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #fa410e;
        }

        nav a {
            
        }

        /* CREATE ACCOUNT */

        .container {
            width: 420px;
            margin: 50px auto;
            background: rgb(243, 237, 242);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .container p {
            text-align: center;
            color: #0f0f0f;
            margin-bottom: 25px;
        }

        /* INPUT */

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            border-color: #ff5577;
            outline: none;
        }

        /* BUTTON */

        button {
            width: 100%;
            padding: 13px;
            background: #ff5577;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e94466;
        }

        /* LOGIN */

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #ff5577;
            text-decoration: none;
            font-weight: bold;
        }

        /* FOOTER */

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        Fashion<span>Store</span>
    </div>

    
</nav>



<!-- CREATE ACCOUNT FORM -->

<div class="container">

    <h1>Create Account</h1>

    <p>Join Fashion Store Today</p>


    <form onsubmit="createAccount(event)">

        <!-- NAME -->

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <!-- EMAIL -->

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <!-- MOBILE -->

        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            maxlength="10"
            required
        >


        <!-- PASSWORD -->

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >


        <!-- CONFIRM PASSWORD -->

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
        >


        <!-- BUTTON -->

        <button type="submit">
            Create Account
        </button>

    </form>


    

        


    </div>

</div>



<!-- FOOTER -->

<footer>

    <p>
        © 2026 Fashion Store | All Rights Reserved
    </p>

</footer>



<script>

function createAccount(event) {

    event.preventDefault();

    let name =
        document.getElementById("name").value;

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;


    /* CHECK PASSWORD */

    if (password !== confirmPassword) {

        alert("Password and Confirm Password do not match!");

        return;
    }


    alert(
        "Account Created Successfully! Welcome " + name
    );


    /* GO TO HOME PAGE */

    window.location.href = "index.html";

}

</script>


</body>

</html>
